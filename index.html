<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gridiron Legacy</title>
<style>
:root{--bg:#080d12;--p:#111922;--line:#253342;--lime:#b7f34a;--txt:#edf4f8;--muted:#91a1b2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,Segoe UI,Arial,sans-serif}
#app{min-height:100vh}.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:22px 14px;background:#0a1016}.brand{font-weight:900;letter-spacing:2px;font-size:20px;margin:0 8px 24px}.brand span{color:var(--lime);display:block;font-size:11px;letter-spacing:5px}
nav{display:grid;gap:5px}.nav{padding:11px 12px;border:0;border-radius:8px;text-align:left;background:transparent;color:var(--muted);cursor:pointer}.nav.active,.nav:hover{background:#17212b;color:white;box-shadow:inset 3px 0 var(--lime)}
main{padding:28px;max-width:1300px;width:100%}h1{margin:4px 0 22px}.eyebrow{color:var(--lime);font-size:11px;font-weight:900;letter-spacing:2px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:linear-gradient(#121b24,#0f161e);border:1px solid var(--line);border-radius:12px;padding:18px}.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.rating{font-size:58px;font-weight:950;color:var(--lime)}.muted{color:var(--muted)}.pill{display:inline-block;padding:5px 9px;border:1px solid var(--line);border-radius:99px;font-size:12px;margin-right:5px}
button{background:var(--lime);color:#081008;border:0;border-radius:7px;padding:10px 13px;font-weight:850;cursor:pointer}.ghost{background:#17212b;color:white;border:1px solid var(--line)}
input,select{width:100%;padding:11px;background:#0a1118;color:white;border:1px solid var(--line);border-radius:7px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{font-size:12px;color:var(--muted);display:grid;gap:6px}
table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #23303d;text-align:left}th{font-size:10px;color:var(--muted)}.news{padding:10px 0;border-bottom:1px solid #23303d}
.modal{position:fixed;inset:0;background:#000c;display:grid;place-items:center;padding:20px}.modal>div{width:min(700px,96vw);background:#111922;border:1px solid #334354;border-radius:14px;padding:24px}
@media(max-width:800px){.shell{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}nav{grid-template-columns:repeat(3,1fr)}.s4,.s6,.s8{grid-column:span 12}.form{grid-template-columns:1fr}}
</style></head>
<body><div id="app"></div>
<script>
"use strict";
const POS=["QB","RB","FB","WR","TE","LT","LG","C","RG","RT","EDGE","DT","NT","MLB","OLB","CB","FS","SS","K","P","LS"];
const COL=["Alabama","Georgia","Ohio State","Michigan","Texas","Florida","Florida State","Miami","LSU","Clemson","Oregon","Penn State","Notre Dame","USC","Tennessee","Auburn","Oklahoma","Texas A&M","Ole Miss","Utah","Iowa","Wisconsin","Louisville","UCF","South Florida","Boise State","Memphis","Tulane"];
const PRO=["Arizona","Atlanta","Baltimore","Buffalo","Carolina","Chicago","Cincinnati","Cleveland","Dallas","Denver","Detroit","Green Bay","Houston","Indianapolis","Jacksonville","Kansas City","Las Vegas","LA Chargers","LA Rams","Miami","Minnesota","New England","New Orleans","NY Giants","NY Jets","Philadelphia","Pittsburgh","San Francisco","Seattle","Tampa Bay","Tennessee","Washington"];
const pages=["Hub","Player","Recruiting","Team","Week","Rankings","Awards","Portal / NIL","Draft","NFL","History","Saves"];
let page="Hub",S=null;
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[rnd(0,a.length-1)],clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function makePlayer(name,pos,diff){let o=rnd(58,72);return{name,pos,diff,phase:"HS",year:2026,age:17,season:"Senior HS",team:"Seminole High",week:1,ovr:o,pot:rnd(Math.max(76,o+6),96),star:o>=70?4:o>=65?3:2,health:100,xp:0,depth:1,record:[0,0],offers:[],college:null,nfl:null,money:0,legacy:0,awards:[],history:[],news:["Senior season begins. Your career has to be earned."],stats:{g:0,yds:0,td:0,tkl:0,sck:0,int:0}}}
function persist(){try{localStorage.setItem("gridironLegacy",JSON.stringify(S))}catch(e){}}
function restore(){try{let x=localStorage.getItem("gridironLegacy");if(x)S=JSON.parse(x)}catch(e){}}
function shell(content){return '<div class="shell"><aside><div class="brand">GRIDIRON<span>LEGACY</span></div><nav>'+pages.map(x=>'<button class="nav '+(x===page?'active':'')+'" data-page="'+x+'">'+x+'</button>').join("")+'</nav></aside><main><div class="eyebrow">GRIDIRON LEGACY / '+page.toUpperCase()+'</div><h1>'+page+'</h1>'+content+'</main></div>'}
function render(){if(!S){creator();return}let f={Hub:hub,Player:player,Recruiting:recruit,Team:team,Week:week,Rankings:rankings,Awards:awards,"Portal / NIL":portal,Draft:draft,NFL:nfl,History:history,Saves:saves};document.getElementById("app").innerHTML=shell((f[page]||hub)());document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});bind()}
function creator(){document.getElementById("app").innerHTML='<div class="modal"><div><div class="eyebrow">NEW CAREER</div><h1>Create Your Player</h1><p class="muted">Start as a high-school senior. Ratings, playing time, recruiting and development are not guaranteed.</p><div class="form"><label>Name<input id="name" value="Colt Haines"></label><label>Position<select id="pos">'+POS.map(x=>'<option>'+x+'</option>').join("")+'</select></label><label>Difficulty<select id="diff"><option>Standard</option><option selected>Hard</option><option>Brutal</option></select></label><label>Archetype<select id="arch"><option>Balanced</option><option>Speed</option><option>Physical</option><option>Technician</option></select></label></div><br><button id="start">Begin Career</button></div></div>';document.getElementById("start").onclick=()=>{S=makePlayer(document.getElementById("name").value||"Player",document.getElementById("pos").value,document.getElementById("diff").value);S.arch=document.getElementById("arch").value;persist();render()}}
function hub(){return '<div class="grid"><div class="card s8"><div class="row"><div><div class="eyebrow">'+S.phase+' · '+S.team+'</div><h2>'+S.name+'</h2><span class="pill">'+S.pos+'</span><span class="pill">'+S.arch+'</span><p class="muted">Age '+S.age+' · '+("★".repeat(S.star))+("☆".repeat(5-S.star))+' · Health '+S.health+'%</p></div><div class="rating">'+S.ovr+'</div></div></div><div class="card s4"><div class="eyebrow">NEXT EVENT</div><h2>Week '+S.week+'</h2><p>'+eventName()+'</p><button id="goWeek">Go to Week</button></div><div class="card s4"><div class="eyebrow">SEASON</div><h2>'+S.record[0]+'-'+S.record[1]+'</h2><p class="muted">'+S.stats.g+' games played</p></div><div class="card s4"><div class="eyebrow">DEPTH</div><h2>'+depth()+'</h2><p class="muted">Role can change with performance and development.</p></div><div class="card s4"><div class="eyebrow">LEGACY</div><h2>'+S.legacy+'</h2><p class="muted">Career reputation score</p></div><div class="card s12"><div class="eyebrow">NEWS</div>'+S.news.slice(-6).reverse().map(n=>'<div class="news">'+n+'</div>').join("")+'</div></div>'}
function player(){return '<div class="grid"><div class="card s4"><div class="rating">'+S.ovr+'</div><h2>'+S.name+'</h2><p>'+S.pos+' · '+S.arch+'</p><p class="muted">Potential estimate '+S.pot+'</p></div><div class="card s8"><div class="eyebrow">CAREER STATS</div><table><tr><th>G</th><th>YDS</th><th>TD</th><th>TKL</th><th>SCK</th><th>INT</th></tr><tr><td>'+S.stats.g+'</td><td>'+S.stats.yds+'</td><td>'+S.stats.td+'</td><td>'+S.stats.tkl+'</td><td>'+S.stats.sck+'</td><td>'+S.stats.int+'</td></tr></table><p>XP '+S.xp+'/100</p></div></div>'}
function ensureOffers(){if(S.offers.length)return;let n=clamp(Math.floor((S.ovr-54)/2),3,10);S.offers=[...COL].sort(()=>Math.random()-.5).slice(0,n).map(s=>({school:s,fit:rnd(52,96),prestige:rnd(55,96)}))}
function recruit(){if(S.phase!=="HS")return '<div class="card"><h2>Recruiting complete</h2><p class="muted">You are now at '+S.team+'.</p></div>';ensureOffers();return '<div class="card"><div class="eyebrow">OFFERS · '+S.star+' STAR</div><table><tr><th>SCHOOL</th><th>FIT</th><th>PRESTIGE</th><th></th></tr>'+S.offers.map((o,i)=>'<tr><td>'+o.school+'</td><td>'+o.fit+'%</td><td>'+o.prestige+'</td><td><button data-commit="'+i+'">Commit</button></td></tr>').join("")+'</table></div>'}
function team(){let arr=Array.from({length:6},(_,i)=>({n:i===S.depth-1?S.name:pick(["Jalen Carter","Malik Davis","Bryce Wilson","Trey Johnson","Mason Brown","Caleb Moore"]),o:i===S.depth-1?S.ovr:rnd(60,91)})).sort((a,b)=>b.o-a.o);return '<div class="grid"><div class="card s4"><h2>'+S.team+'</h2><p>'+S.phase+' · '+S.season+'</p></div><div class="card s8"><div class="eyebrow">'+S.pos+' DEPTH CHART</div><table>'+arr.map((x,i)=>'<tr><td>#'+(i+1)+'</td><td>'+x.n+(x.n===S.name?' · YOU':'')+'</td><td>'+x.o+' OVR</td></tr>').join("")+'</table></div></div>'}
function week(){return '<div class="grid"><div class="card s6"><div class="eyebrow">WEEK '+S.week+'</div><h2>Preparation</h2><p class="muted">Training has upside but also fatigue risk.</p><button data-act="practice">Focused Practice</button> <button class="ghost" data-act="recover">Recovery</button></div><div class="card s6"><div class="eyebrow">GAME DAY</div><h2>'+S.team+' vs '+opponent()+'</h2><p>Role: '+depth()+'</p><button id="game">Simulate Game</button></div></div>'}
function rankings(){let a=[S.team,...COL].filter((x,i,z)=>z.indexOf(x)===i).slice(0,25).map(t=>({t,s:rnd(60,99)})).sort((a,b)=>b.s-a.s);return '<div class="card"><table><tr><th>#</th><th>TEAM</th><th>POWER</th></tr>'+a.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+x.t+'</td><td>'+x.s+'</td></tr>').join("")+'</table></div>'}
function awards(){return '<div class="grid"><div class="card s6"><h2>Award Watch</h2><p>Your current award score: <b>'+clamp(S.ovr+Math.floor(S.legacy/8),1,99)+'</b></p></div><div class="card s6"><h2>Career Honors</h2><p class="muted">'+(S.awards.join(" · ")||"No major awards yet.")+'</p></div></div>'}
function portal(){return S.phase==="College"?'<div class="grid"><div class="card s6"><h2>NIL Valuation</h2><div class="rating">$'+Math.max(5,Math.round((S.ovr-55)*8+S.legacy*2))+'K</div></div><div class="card s6"><h2>Transfer Portal</h2><p class="muted">Entering can improve fit or playing time, but carries risk.</p><button id="portal">Enter Portal</button></div></div>':'<div class="card"><h2>Portal & NIL</h2><p class="muted">Available during your college career.</p></div>'}
function draft(){let g=clamp(S.ovr+Math.floor(S.legacy/8)-rnd(0,8),45,99);return '<div class="grid"><div class="card s4"><div class="eyebrow">SCOUT GRADE</div><div class="rating">'+g+'</div></div><div class="card s8"><h2>Draft Outlook</h2><p>'+(S.phase==="HS"?"Complete college before entering the pro draft.":g>88?"Round 1 range":g>80?"Day 2 range":g>70?"Day 3 range":"Free-agent range")+'</p></div></div>'}
function nfl(){return '<div class="grid">'+PRO.map(t=>'<div class="card s4"><b>'+t+'</b><p class="muted">'+rnd(68,91)+' team OVR</p></div>').join("")+'</div>'}
function history(){return '<div class="card"><h2>Career Timeline</h2>'+(S.history.length?S.history.slice().reverse().map(x=>'<div class="news"><b>'+x.year+'</b> · '+x.text+'</div>').join(""):'<p class="muted">Your story is just beginning.</p>')+'</div>'}
function saves(){return '<div class="card"><h2>Save File</h2><p>This career automatically saves in this browser.</p><button id="save">Save Now</button> <button id="reset" class="ghost">Start New Career</button></div>'}
function bind(){let g=document.getElementById("goWeek");if(g)g.onclick=()=>{page="Week";render()};document.querySelectorAll("[data-commit]").forEach(b=>b.onclick=()=>commit(+b.dataset.commit));document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>activity(b.dataset.act));let gm=document.getElementById("game");if(gm)gm.onclick=game;let po=document.getElementById("portal");if(po)po.onclick=()=>{S.news.push(S.name+" entered the transfer portal.");S.team=pick(COL.filter(x=>x!==S.team));S.news.push(S.name+" transferred to "+S.team+".");persist();render()};let sv=document.getElementById("save");if(sv)sv.onclick=()=>{persist();alert("Career saved.")};let rs=document.getElementById("reset");if(rs)rs.onclick=()=>{if(confirm("Start a new career?")){S=null;try{localStorage.removeItem("gridironLegacy")}catch(e){}creator()}}}
function commit(i){let o=S.offers[i];S.college=o.school;S.team=o.school;S.phase="College";S.year++;S.age++;S.season="Freshman";S.week=1;S.depth=rnd(2,5);S.history.push({year:S.year,text:"Committed to "+o.school});S.news.push(S.name+" signs with "+o.school+".");page="Hub";persist();render()}
function activity(a){if(a==="practice"){S.xp+=rnd(8,18);S.health=clamp(S.health-rnd(1,5),45,100)}else S.health=clamp(S.health+rnd(8,16),0,100);if(S.xp>=100){S.xp-=100;if(S.ovr<S.pot&&Math.random()<.75)S.ovr++}persist();render()}
function game(){let opp=opponent(),oppO=rnd(60,94),role=Math.max(0,5-S.depth),d=S.diff==="Brutal"?.90:S.diff==="Hard"?.96:1,perf=S.ovr*(S.health/100)*d+rnd(-14,14)-oppO/4+role*3,win=perf+rnd(0,35)>45;S.record[win?0:1]++;S.stats.g++;let snaps=S.depth<=2?rnd(35,70):S.depth===3?rnd(10,30):rnd(0,10);if(["QB","RB","FB","WR","TE"].includes(S.pos)){S.stats.yds+=Math.max(0,Math.floor(snaps*(perf/100)*rnd(1,4)));S.stats.td+=Math.random()<clamp(perf/100,.1,.7)?rnd(0,2):0}else{S.stats.tkl+=Math.floor(snaps*clamp(perf/100,.1,.8)/5);if(["EDGE","DT","NT","MLB","OLB"].includes(S.pos)&&Math.random()<.45)S.stats.sck+=rnd(0,2);if(["CB","FS","SS"].includes(S.pos)&&Math.random()<.18)S.stats.int++}S.xp+=rnd(8,20);S.legacy+=win?rnd(0,3):0;S.health=clamp(S.health-rnd(0,5),40,100);S.news.push(S.team+" "+(win?"defeats ":"falls to ")+opp+". "+S.name+" played "+snaps+" snaps.");S.week++;if(S.week>14)seasonEnd();persist();render()}
function seasonEnd(){S.history.push({year:S.year,text:S.season+" season: "+S.record[0]+"-"+S.record[1]});S.year++;S.age++;S.week=1;S.record=[0,0];if(S.phase==="HS"){ensureOffers();page="Recruiting";S.news.push("Senior season complete. College decision time.")}else if(S.phase==="College"){let yrs=S.history.filter(x=>/season/.test(x.text)&&S.college).length;if(yrs>=4){S.phase="Draft";S.team="NFL Prospect";S.season="Draft Prep";S.news.push(S.name+" declared for the pro draft.")}else{S.season=["Sophomore","Junior","Senior"][Math.min(yrs-1,2)];S.depth=clamp(S.depth-(Math.random()<.65?1:0),1,5)}}else if(S.phase==="Draft"){S.nfl=pick(PRO);S.team=S.nfl;S.phase="NFL";S.season="Rookie";S.depth=S.ovr>86?1:S.ovr>78?2:4;S.news.push(S.name+" joins "+S.nfl+".")}else if(S.phase==="NFL"){S.season="NFL Year "+Math.max(1,S.age-21)}}
function eventName(){return S.phase==="HS"?"High School Regular Season":S.phase==="College"?"College Regular Season":S.phase==="Draft"?"Draft Process":S.phase==="NFL"?"Pro Regular Season":"Career"}
function opponent(){return pick((S.phase==="NFL"?PRO:COL).filter(x=>x!==S.team))}
function depth(){return S.depth===1?"Starter":S.depth===2?"No. 2 / Rotation":S.depth===3?"Backup":S.depth===4?"Reserve":"Roster Bubble"}
window.addEventListener("error",e=>{document.getElementById("app").innerHTML='<main><div class="card"><h1>Startup Error</h1><p>'+String(e.message)+'</p></div></main>'});
restore();render();
</script></body></html>
