<style>
:root{--bg:#080a0f;--panel:#191d27;--panel2:#222733;--line:#373d4b;--text:#f4f5f8;--muted:#a7adbb;--accent:#ef3127;--orange:#ff7a00;--gold:#e7ad14;--green:#32c866;--blue:#2780e3;--danger:#ff6b6b}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 72% 0,#341713 0,transparent 31rem),linear-gradient(180deg,#0d0f16,#07090e 70%);min-height:100vh}button,input,select{font:inherit}button{touch-action:manipulation}.app{width:min(900px,100%);margin:auto;padding:18px 16px 96px}.hero{padding:22px 4px 16px}.eyebrow{font-size:11px;letter-spacing:2.2px;font-weight:900;color:var(--accent);text-transform:uppercase}.hero h1{font-size:clamp(34px,7vw,54px);line-height:.98;margin:9px 0 12px;font-style:italic}.hero p{color:var(--muted);font-size:17px;line-height:1.55;max-width:680px}.panel{position:relative;background:linear-gradient(145deg,#202530,#171b24);border:1px solid var(--line);border-radius:26px;padding:20px;margin:14px 0;overflow:hidden;box-shadow:0 18px 42px #0006}.panel:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--orange),transparent 80%)}.sectionTitle{font-size:13px;letter-spacing:2.5px;color:#c8ccd5;text-align:center;font-weight:900;text-transform:uppercase;margin-bottom:17px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{font-size:12px;letter-spacing:1px;color:var(--muted);text-transform:uppercase}.field input,.field select{width:100%;min-height:52px;margin-top:7px;background:#292e3a;border:1px solid #3b4252;border-radius:16px;color:white;padding:0 15px;font-size:16px;outline:none}.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #ef312722}.styleGrid,.offerGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{width:100%;text-align:left;background:#282d39;border:1px solid #3b4251;border-radius:20px;padding:16px;color:white;min-height:105px}.choice.selected{border:2px solid var(--accent);background:#342326}.choice b{display:block;font-size:18px}.choice small{display:block;color:var(--muted);font-size:14px;line-height:1.35;margin-top:7px}.btnRow{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:18px;min-height:50px;padding:0 18px;font-weight:900;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#e72c25,#a9130f);color:white}.btn.secondary{background:#282d38;color:white;border:1px solid #444b5b}.btn.danger{background:#1c1d22;color:#ffb1b1;border:1px solid #623131}.btn.full{width:100%}.profile{display:grid;grid-template-columns:118px 1fr auto;gap:18px;align-items:center}.ovr{display:grid;place-items:center;background:linear-gradient(145deg,#b77c00,#745000);border-radius:28px;width:112px;height:112px;font-size:44px;font-weight:950}.ovr small{font-size:12px;letter-spacing:2px}.profile h2{font-size:30px;margin:0 0 8px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid #414757;border-radius:999px;padding:7px 10px;color:#d8dbe3;font-size:12px}.rightMeta{text-align:right}.rightMeta .big{font-size:32px;font-weight:950}.muted{color:var(--muted)}.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.stat{background:#262b36;border-radius:19px;padding:16px;text-align:center}.stat .n{font-size:29px;font-weight:950}.stat .l{color:var(--muted);font-size:11px;letter-spacing:1.8px;text-transform:uppercase}.careerCard{border:2px solid #255ea4;background:#1e2430}.careerCard.orange{border-color:#c87800}.careerCard .org{font-size:24px;font-weight:900}.careerCard .stars{color:#f2b91c;font-size:20px}.careerCard .tag{display:inline-block;background:#253044;border:1px solid #3a4c6a;border-radius:12px;padding:9px 11px;margin-top:10px;color:#cbd2df;line-height:1.35}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 14px}.brand{font-weight:950;font-style:italic;font-size:21px}.brand span{color:var(--accent)}.pill{background:#1f232d;border:1px solid #3a404d;border-radius:999px;padding:9px 12px;font-size:12px}.tabbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(900px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#0e1118ee;backdrop-filter:blur(12px);border-top:1px solid #2d323d;z-index:20}.tabbar button{background:transparent;border:0;color:#8d94a3;padding:7px 2px;font-size:10px;font-weight:800}.tabbar button.active{color:white}.tabbar button span{display:block;font-size:18px;margin-bottom:3px}.progress{height:8px;background:#323744;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--orange))}.tableWrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:580px}.table th,.table td{padding:11px 8px;border-bottom:1px solid #313744;text-align:left}.table th{font-size:11px;color:var(--muted);letter-spacing:1px}.win{color:var(--green);font-weight:900}.loss{color:var(--danger);font-weight:900}.news{padding:11px 0;border-bottom:1px solid #303641;line-height:1.4}.rankBadge{font-size:50px;font-weight:950}.error{background:#38191a;border:1px solid #6b292c;border-radius:18px;padding:15px;color:#ffd2d2}.subtle{font-size:13px;color:var(--muted);line-height:1.5}.divider{height:1px;background:#343945;margin:18px 0}.contractLine{display:flex;justify-content:space-between;gap:12px;margin:9px 0}.screenTitle{font-size:36px;font-style:italic;margin:7px 0 5px}.fightHead{text-align:center;padding:10px 0}.fightHead .vs{font-size:12px;letter-spacing:3px;color:var(--muted)}.fightHead h2{font-size:27px;margin:9px 0}.result{font-size:44px;font-weight:950;text-align:center}.banner{background:#2a2223;border:1px solid #56302f;border-radius:18px;padding:14px;margin-top:12px}.offerGrid .careerCard{margin:0}.creatorBack{max-width:820px;margin:auto;padding:22px 16px 50px}.creatorTop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.logoMark{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,#f23129,#b8130e);font-size:30px}.note{font-size:12px;color:#858c99}.stack{display:grid;gap:12px}
@media(max-width:700px){.app{padding:10px 12px 90px}.grid2,.styleGrid,.offerGrid{grid-template-columns:1fr}.profile{grid-template-columns:92px 1fr}.ovr{width:86px;height:86px;border-radius:22px;font-size:34px}.rightMeta{grid-column:1/-1;text-align:left;display:flex;gap:14px}.stats4{grid-template-columns:1fr 1fr}.panel{padding:17px;border-radius:23px}.hero{padding-top:12px}.hero p{font-size:16px}.screenTitle{font-size:30px}}

<body>
<div id="root"></div>
<script>
"use strict";
const DIVS=[["Flyweight",125],["Bantamweight",135],["Featherweight",145],["Lightweight",155],["Welterweight",170],["Middleweight",185],["Light Heavyweight",205],["Heavyweight",265]];
const STYLES=[
{name:"Boxer",icon:"🥊",desc:"Sharp hands, timing and knockout threat.",strike:7,grap:0,cardio:1},
{name:"Kickboxer",icon:"🦵",desc:"Range, combinations and balanced striking.",strike:6,grap:0,cardio:2},
{name:"Muay Thai",icon:"🔥",desc:"Pressure striking and clinch offense.",strike:6,grap:1,cardio:1},
{name:"Wrestler",icon:"🤼",desc:"Takedowns, top control and pace.",strike:0,grap:7,cardio:2},
{name:"Brazilian Jiu-Jitsu",icon:"🥋",desc:"Submissions and dangerous ground game.",strike:0,grap:7,cardio:1},
{name:"Judo",icon:"🥋",desc:"Throws, trips and positional control.",strike:1,grap:6,cardio:1},
{name:"Karate",icon:"⚡",desc:"Movement, distance and counter striking.",strike:6,grap:0,cardio:2},
{name:"Well-Rounded",icon:"⚖️",desc:"Balanced tools with no major weakness.",strike:3,grap:3,cardio:2}
];
const COUNTRIES=["🇺🇸 USA","🇧🇷 Brazil","🇬🇧 United Kingdom","🇲🇽 Mexico","🇨🇦 Canada","🇦🇺 Australia","🇳🇿 New Zealand","🇮🇪 Ireland","🇫🇷 France","🇩🇪 Germany","🇪🇸 Spain","🇯🇵 Japan","🇰🇷 South Korea","🇷🇺 Russia","🇬🇪 Georgia","🇳🇬 Nigeria"];
const DEALS={"Regional MMA":[1,3,800,2800],"LFA":[2,4,3500,12000],"Cage Warriors":[2,5,4000,14000],"PFL":[2,5,9000,40000],"ONE Championship":[2,5,8000,35000],"UFC":[3,5,12000,65000],"Professional Boxing":[1,4,2000,25000]};
const UFC={Flyweight:[["Joshua Van",18,2,66],["Alexandre Pantoja",30,6,65],["Brandon Moreno",23,9,67]],Bantamweight:[["Petr Yan",20,5,67],["Merab Dvalishvili",19,5,66],["Cory Sandhagen",18,7,71]],Featherweight:[["Alexander Volkanovski",28,4,66],["Diego Lopes",27,7,71]],Lightweight:[["Justin Gaethje",28,5,71],["Ilia Topuria",17,0,67],["Max Holloway",27,8,71],["Charles Oliveira",36,11,70]],Welterweight:[["Islam Makhachev",29,1,70],["Ian Machado Garry",17,1,75]],Middleweight:[["Sean Strickland",31,7,73],["Dricus Du Plessis",24,3,73],["Khamzat Chimaev",15,1,74]],"Light Heavyweight":[["Carlos Ulberg",15,1,76],["Alex Pereira",13,3,76],["Jiri Prochazka",32,6,75]],Heavyweight:[["Tom Aspinall",15,3,77],["Ciryl Gane",13,3,76]]};
const root=document.getElementById("root");
let S=null,screen="home",creatorStyle="Well-Rounded";
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[rnd(0,a.length-1)],clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),money=n=>"$"+Math.round(n||0).toLocaleString(),ht=n=>Math.floor(n/12)+"' "+n%12+'"';
function save(){try{localStorage.setItem("path_ufc_v2",JSON.stringify(S))}catch(e){}}
function load(){try{const raw=localStorage.getItem("path_ufc_v2");if(raw)S=JSON.parse(raw)}catch(e){S=null}}
function migrate(){if(!S)return;S.version=2;S.style=S.style||"Well-Rounded";S.country=S.country||"🇺🇸 USA";S.camp=S.camp||"Balanced";S.rankPoints=S.rankPoints||0;S.ufcRank=S.ufcRank||null;S.champion=!!S.champion;S.history=Array.isArray(S.history)?S.history:[];S.fights=Array.isArray(S.fights)?S.fights:[];S.offers=Array.isArray(S.offers)?S.offers:[];S.contractOffer=S.contractOffer||null;S.offer=S.offer||null;S.money=S.money||0;S.popularity=S.popularity||0;S.declines=S.declines||0;S.negotiations=S.negotiations||0}
function styleObj(n){return STYLES.find(x=>x.name===n)||STYLES[7]}
function makeStarterOffers(){return[{org:"Regional MMA",label:"Winning project",desc:"Better matchmaking and quicker visibility if you keep winning.",fights:2,base:1400,stars:3,tone:"blue"},{org:"LFA",label:"Balanced project",desc:"Harder competition, better exposure and a clearer route upward.",fights:3,base:3500,stars:3,tone:"blue"},{org:"Cage Warriors",label:"Development project",desc:"A longer deal focused on building experience before the biggest stage.",fights:4,base:3000,stars:2,tone:"orange"}]}
function newState(v){const st=styleObj(v.style);return{name:v.name,age:v.age,height:v.height,division:v.division[0],limit:v.division[1],style:v.style,country:v.country,org:"Free Agent",overall:58,potential:rnd(84,95),striking:55+st.strike+rnd(0,4),grappling:55+st.grap+rnd(0,4),cardio:57+st.cardio+rnd(0,4),durability:rnd(58,67),popularity:0,wins:0,losses:0,ko:0,sub:0,dec:0,money:0,year:2026,fights:[],history:["Career created. Looking for the right first promotion."],offers:makeStarterOffers(),contract:null,contractOffer:null,offer:null,camp:"Balanced",rankPoints:0,ufcRank:null,champion:false,declines:0,negotiations:0,lastResult:null}}
function creator(){creatorStyle="Well-Rounded";root.innerHTML='<div class="creatorBack"><div class="creatorTop"><div class="logoMark">🥊</div><div class="pill">Career mode</div></div><div class="hero"><div class="eyebrow">Path to the UFC</div><h1>Build your career in MMA</h1><p>Start on the regional scene, choose your path, develop your fighter and earn your way into the biggest promotions.</p></div><div class="panel"><div class="sectionTitle">Identity</div><div class="grid2"><div class="field"><label>Fighter name<input id="name" value="Colt Haines" maxlength="30"></label></div><div class="field"><label>Nationality<select id="country">'+COUNTRIES.map(x=>'<option>'+x+'</option>').join("")+'</select></label></div><div class="field"><label>Starting age<select id="age">'+[18,19,20,21,22].map(x=>'<option>'+x+'</option>').join("")+'</select></label></div><div class="field"><label>Height<select id="height">'+Array.from({length:16},(_,i)=>'<option value="'+(64+i)+'">'+ht(64+i)+'</option>').join("")+'</select></label></div><div class="field"><label>Weight class<select id="division">'+DIVS.map((x,i)=>'<option value="'+i+'">'+x[0]+' · '+x[1]+' lb</option>').join("")+'</select></label></div></div></div><div class="panel"><div class="sectionTitle">Fighting identity</div><p class="muted">Pick the archetype that defines your starting strengths. You can develop beyond it later.</p><div class="styleGrid">'+STYLES.map(x=>'<button type="button" class="choice '+(x.name===creatorStyle?'selected':'')+'" data-style="'+x.name+'"><b>'+x.icon+' '+x.name+'</b><small>'+x.desc+'</small></button>').join("")+'</div></div><button class="btn primary full" id="confirm">Confirm identity →</button><p class="note" style="text-align:center;margin-top:10px">This starts a new save.</p></div>';root.querySelectorAll("[data-style]").forEach(b=>b.onclick=()=>{creatorStyle=b.dataset.style;root.querySelectorAll("[data-style]").forEach(x=>x.classList.toggle("selected",x.dataset.style===creatorStyle))});document.getElementById("confirm").onclick=()=>{const name=document.getElementById("name").value.trim()||"Fighter",div=DIVS[+document.getElementById("division").value];S=newState({name,age:+document.getElementById("age").value,height:+document.getElementById("height").value,division:div,style:creatorStyle,country:document.getElementById("country").value});save();screen="offers";render()}}
function layout(content,active){return '<div class="app"><div class="topbar"><div class="brand">PATH TO <span>THE UFC</span></div><div class="pill">'+S.year+' · '+S.division+'</div></div>'+content+'</div><nav class="tabbar"><button data-tab="home" class="'+(active==="home"?"active":"")+'"><span>🏠</span>Home</button><button data-tab="career" class="'+(active==="career"?"active":"")+'"><span>📈</span>Career</button><button data-tab="fight" class="'+(active==="fight"?"active":"")+'"><span>🥊</span>Fight</button><button data-tab="rankings" class="'+(active==="rankings"?"active":"")+'"><span>🏆</span>Rank</button><button data-tab="more" class="'+(active==="more"?"active":"")+'"><span>☰</span>More</button></nav>'}
function fameLabel(){return S.popularity<10?"Unknown":S.popularity<30?"Prospect":S.popularity<55?"Rising":S.popularity<80?"Star":"Superstar"}
function profileCard(){return '<div class="panel"><div class="profile"><div class="ovr">'+S.overall+'<small>OVR</small></div><div><div class="chips"><span class="chip">'+S.country+'</span><span class="chip">'+S.style+'</span></div><h2>'+S.name+'</h2><div class="muted">'+S.org+' · '+S.division+'</div></div><div class="rightMeta"><div class="muted">AGE</div><div class="big">'+S.age+'</div><div class="muted">FAME</div><b>'+fameLabel()+'</b></div></div><div class="divider"></div><div class="stats4"><div class="stat"><div class="l">Fights</div><div class="n">'+(S.wins+S.losses)+'</div></div><div class="stat"><div class="l">Wins</div><div class="n" style="color:var(--gold)">'+S.wins+'</div></div><div class="stat"><div class="l">KO/TKO</div><div class="n" style="color:var(--green)">'+S.ko+'</div></div><div class="stat"><div class="l">Subs</div><div class="n" style="color:#8b5cf6">'+S.sub+'</div></div></div></div>'}
function home(){const next=S.offers.length?"Choose your first promotion":S.contractOffer?"Promotion contract":S.offer?"Fight offer":"New opportunity",action=S.offers.length?"offers":S.contractOffer?"contract":S.offer?"fight":"advance";return layout(profileCard()+'<div class="hero"><div class="eyebrow">Next step</div><h1 class="screenTitle">'+next+'</h1><p>'+(S.offers.length?"Three organizations want to start your career. Pick the project that fits you.":S.contractOffer?S.contractOffer.org+" has sent a multi-fight deal.":S.offer?S.offer.org+" wants you against "+S.offer.opp+".":"Advance your career to generate the next opportunity.")+'</p></div><button class="btn primary full" data-action="'+action+'">Continue career →</button><div class="panel"><div class="sectionTitle">Latest news</div>'+S.history.slice(-4).reverse().map(x=>'<div class="news">'+x+'</div>').join("")+'</div>',"home")}
function starterOffers(){return layout(profileCard()+'<div class="hero"><div class="eyebrow">Career opportunity</div><h1 class="screenTitle">Promotion offers</h1><p>Three promotions are interested. The easiest contract is not always the best career move.</p></div><div class="offerGrid">'+S.offers.map((o,i)=>'<div class="panel careerCard '+(o.tone==="orange"?"orange":"")+'"><div class="org">'+o.org+'</div><div class="muted">'+o.fights+'-fight deal · '+money(o.base)+' per fight</div><div class="tag"><b>'+o.label+'</b> · '+o.desc+'</div><div class="stars">'+"★".repeat(o.stars)+"☆".repeat(5-o.stars)+'</div><br><button class="btn primary full" data-pick-offer="'+i+'">Sign with '+o.org+'</button></div>').join("")+'</div>',"career")}
function meter(label,v){return '<div style="margin:13px 0"><div style="display:flex;justify-content:space-between"><span>'+label+'</span><b>'+v+'</b></div><div class="progress"><i style="width:'+clamp(v,0,100)+'%"></i></div></div>'}
function career(){return layout(profileCard()+'<div class="panel"><div class="sectionTitle">Career status</div><div class="contractLine"><span>Promotion</span><b>'+S.org+'</b></div><div class="contractLine"><span>Contract</span><b>'+(S.contract?S.contract.left+" of "+S.contract.total+" fights left":"Free agent")+'</b></div><div class="contractLine"><span>Base purse</span><b>'+(S.contract?money(S.contract.base):"—")+'</b></div><div class="contractLine"><span>Career earnings</span><b>'+money(S.money)+'</b></div><div class="contractLine"><span>UFC status</span><b>'+(S.champion?"Champion":S.ufcRank?"#"+S.ufcRank:"Unranked")+'</b></div></div><div class="panel"><div class="sectionTitle">Development</div>'+meter("Striking",S.striking)+meter("Grappling",S.grappling)+meter("Cardio",S.cardio)+meter("Durability",S.durability)+'</div>',"career")}
function createContractOffer(){if(S.contract&&S.contract.left>0)return;let pool=["Regional MMA"];if(S.wins>=2)pool.push("LFA","Cage Warriors");if(S.wins>=5)pool.push("PFL","ONE Championship");if(S.wins>=7&&S.popularity>=30)pool.push("UFC");if(S.wins>=4)pool.push("Professional Boxing");const org=pick(pool),d=DEALS[org];S.contractOffer={org,fights:rnd(d[0],d[1]),base:rnd(d[2],d[3])};save()}
function contract(){if(!S.contractOffer)createContractOffer();const o=S.contractOffer;return layout(profileCard()+'<div class="hero"><div class="eyebrow">Contract offer</div><h1 class="screenTitle">'+o.org+' wants you</h1><p>Review the length and money before deciding. You can negotiate, accept, or walk away.</p></div><div class="panel careerCard"><div class="contractLine"><span>Length</span><b>'+o.fights+' fights</b></div><div class="contractLine"><span>Base purse</span><b>'+money(o.base)+' / fight</b></div><div class="contractLine"><span>Division</span><b>'+S.division+'</b></div><div class="divider"></div><div class="btnRow"><button class="btn primary" id="sign">Accept contract</button><button class="btn secondary" id="negotiate">Negotiate</button><button class="btn danger" id="reject">Decline</button></div><p class="subtle">Negotiating may increase the purse, but the promotion can withdraw the offer.</p></div>',"career")}
function genOpponent(){if(S.org==="UFC"&&UFC[S.division]?.length)return pick(UFC[S.division]);const first=["Marcus","Dante","Eli","Mateo","Andre","Niko","Caleb","Roman","Jalen","Victor","Noah","Adrian"],last=["Silva","Torres","Bennett","Costa","Reed","Santos","Price","Navarro","King","Morales","Flores","Diaz"];return[pick(first)+" "+pick(last),rnd(1,18),rnd(0,7),rnd(64,77)]}
function createFightOffer(){if(S.offer)return;const o=genOpponent(),short=Math.random()<.13;S.offer={org:S.org,opp:o[0],oppWins:o[1],oppLosses:o[2],oppHeight:o[3],pay:S.contract?S.contract.base:rnd(1200,4000),rounds:(S.champion||S.ufcRank===1)?5:3,days:short?rnd(7,14):rnd(35,90),short};save()}
function campDescription(x){return{Balanced:"Safe preparation across every area.",Striking:"Sharper stand-up and timing.",Wrestling:"Takedowns, control and defense.",Grappling:"Ground transitions and submissions.",Cardio:"More pace across later rounds.",Recovery:"Lower workload and fresher fight night."}[x]}
function fight(){if(S.offers.length){screen="offers";return render()}if(!S.contract&&!S.contractOffer){createContractOffer();screen="contract";return render()}if(S.contractOffer){screen="contract";return render()}if(!S.offer)createFightOffer();const o=S.offer;return layout(profileCard()+'<div class="hero"><div class="eyebrow">Fight offer'+(o.short?" · Short notice":"")+'</div><h1 class="screenTitle">Accept or decline</h1><p>You control the career. A bad matchup can be declined, but repeated declines can slow momentum.</p></div><div class="panel"><div class="fightHead"><div class="muted">'+o.org+' · '+S.division+' · '+o.rounds+' rounds</div><h2>'+S.name+'</h2><div class="vs">VERSUS</div><h2>'+o.opp+'</h2><div class="chips" style="justify-content:center"><span class="chip">'+o.oppWins+'-'+o.oppLosses+'</span><span class="chip">'+ht(o.oppHeight)+'</span><span class="chip">'+o.days+' days away</span><span class="chip">'+money(o.pay)+'</span></div></div><div class="divider"></div><div class="sectionTitle">Camp plan</div><div class="styleGrid">'+["Balanced","Striking","Wrestling","Grappling","Cardio","Recovery"].map(x=>'<button class="choice '+(S.camp===x?"selected":"")+'" data-camp="'+x+'"><b>'+x+'</b><small>'+campDescription(x)+'</small></button>').join("")+'</div><br><div class="btnRow"><button class="btn primary" id="acceptFight">Accept fight</button><button class="btn danger" id="declineFight">Decline fight</button></div></div>',"fight")}
function campBonus(){let b=2,st=S.style;if(S.camp==="Striking"&&["Boxer","Kickboxer","Muay Thai","Karate"].includes(st))b=7;else if(S.camp==="Wrestling"&&st==="Wrestler")b=8;else if(S.camp==="Grappling"&&["Brazilian Jiu-Jitsu","Judo"].includes(st))b=8;else if(S.camp==="Cardio")b=4;else if(S.camp==="Recovery")b=1;return b}
function simulateFight(){const o=S.offer;if(!o)return;const opp=clamp(55+o.oppWins*1.65-o.oppLosses+rnd(-3,5),52,95),user=S.overall+(S.striking+S.grappling+S.cardio)/45+campBonus()+rnd(-13,13),foe=opp+rnd(-12,12),win=user>=foe;let methods;if(["Wrestler","Brazilian Jiu-Jitsu","Judo"].includes(S.style))methods=["Decision","Submission","Decision","KO/TKO"];else if(["Boxer","Kickboxer","Muay Thai","Karate"].includes(S.style))methods=["KO/TKO","Decision","KO/TKO","Submission"];else methods=["Decision","KO/TKO","Submission"];const method=pick(methods),round=method==="Decision"?o.rounds:rnd(1,o.rounds);if(win){S.wins++;if(method==="KO/TKO")S.ko++;else if(method==="Submission")S.sub++;else S.dec++;S.popularity=clamp(S.popularity+rnd(4,10)+(o.short?3:0),0,100);if(S.overall<S.potential&&Math.random()<.72)S.overall++;S.striking=clamp(S.striking+(S.camp==="Striking"?rnd(1,2):rnd(0,1)),0,99);S.grappling=clamp(S.grappling+(["Wrestling","Grappling"].includes(S.camp)?rnd(1,2):rnd(0,1)),0,99);S.cardio=clamp(S.cardio+(S.camp==="Cardio"?rnd(1,2):rnd(0,1)),0,99)}else{S.losses++;S.popularity=clamp(S.popularity-rnd(0,3),0,100)}if(o.org==="UFC"){S.rankPoints=clamp(S.rankPoints+(win?rnd(8,16):-rnd(4,9)),0,120);S.ufcRank=S.rankPoints>=100?1:S.rankPoints>=90?3:S.rankPoints>=78?5:S.rankPoints>=65?8:S.rankPoints>=50?12:S.rankPoints>=38?15:null;if(S.rankPoints>=112&&win){S.champion=true;S.ufcRank=null}}S.money+=o.pay;if(S.contract)S.contract.left=Math.max(0,S.contract.left-1);const rec={year:S.year,opp:o.opp,org:o.org,result:win?"W":"L",method,round,pay:o.pay};S.fights.push(rec);S.lastResult=rec;S.history.push((win?"Defeated ":"Lost to ")+o.opp+" by "+method+" in Round "+round+" at "+o.org+".");S.offer=null;if(S.contract&&S.contract.left===0){S.history.push("Completed the "+S.contract.total+"-fight contract with "+S.contract.org+".");S.contract=null;createContractOffer()}if((S.wins+S.losses)%3===0){S.year++;S.age++}save();screen="result";render()}
function resultScreen(){const r=S.lastResult;if(!r){screen="home";return home()}return layout(profileCard()+'<div class="panel"><div class="eyebrow" style="text-align:center">Fight result</div><div class="result '+(r.result==="W"?"win":"loss")+'">'+(r.result==="W"?"WIN":"LOSS")+'</div><div class="fightHead"><h2>'+S.name+" "+(r.result==="W"?"def.":"lost to")+" "+r.opp+'</h2><div class="muted">'+r.method+" · Round "+r.round+" · "+r.org+'</div></div><div class="stats4"><div class="stat"><div class="l">Record</div><div class="n">'+S.wins+"-"+S.losses+'</div></div><div class="stat"><div class="l">Overall</div><div class="n">'+S.overall+'</div></div><div class="stat"><div class="l">Fame</div><div class="n">'+S.popularity+'</div></div><div class="stat"><div class="l">Earned</div><div class="n" style="font-size:20px">'+money(r.pay)+'</div></div></div><br><button class="btn primary full" id="afterResult">Continue career →</button></div>',"fight")}
function rankings(){const p=S.rankPoints||0;return layout(profileCard()+'<div class="panel"><div class="sectionTitle">'+S.division+' title path</div><div class="rankBadge">'+(S.champion?"CHAMPION":S.ufcRank?"#"+S.ufcRank:"UNRANKED")+'</div><p class="muted">'+p+' ranking points</p><div class="progress"><i style="width:'+clamp(p/1.2,0,100)+'%"></i></div><div class="banner">UFC wins move your career ranking. Stronger opposition can accelerate the climb. This is a simulated career ranking, separate from the real-world official rankings.</div></div>',"rankings")}
function record(){return layout(profileCard()+'<div class="panel"><div class="sectionTitle">Fight history</div><div class="tableWrap"><table class="table"><tr><th>Result</th><th>Opponent</th><th>Org</th><th>Method</th><th>Round</th><th>Pay</th></tr>'+S.fights.slice().reverse().map(r=>'<tr><td class="'+(r.result==="W"?"win":"loss")+'">'+r.result+'</td><td>'+r.opp+'</td><td>'+r.org+'</td><td>'+r.method+'</td><td>'+r.round+'</td><td>'+money(r.pay)+'</td></tr>').join("")+'</table></div></div>',"more")}
function more(){return layout(profileCard()+'<div class="stack"><button class="choice" data-more="record"><b>📚 Fight record</b><small>Every professional fight and result.</small></button><button class="choice" data-more="weight"><b>⚖️ Change weight class</b><small>Move divisions. UFC ranking progress will be reduced.</small></button><button class="choice" data-more="new"><b>↻ New career</b><small>Erase this save and create a new fighter.</small></button></div>',"more")}
function weightScreen(){const i=DIVS.findIndex(x=>x[0]===S.division);return layout(profileCard()+'<div class="panel"><div class="sectionTitle">Change division</div><p class="muted">Moving divisions changes your opponent pool and reduces your simulated UFC ranking progress.</p><div class="btnRow"><button class="btn secondary" id="down" '+(i===0?"disabled":"")+'">← '+(i>0?DIVS[i-1][0]:"No lower class")+'</button><button class="btn secondary" id="up" '+(i===DIVS.length-1?"disabled":"")+'">'+(i<DIVS.length-1?DIVS[i+1][0]:"No higher class")+' →</button></div></div>',"more")}
function changeWeight(dir){const i=DIVS.findIndex(x=>x[0]===S.division),n=clamp(i+dir,0,DIVS.length-1);if(n===i)return;const old=S.division;S.division=DIVS[n][0];S.limit=DIVS[n][1];S.rankPoints=Math.floor(S.rankPoints*.45);S.ufcRank=null;S.champion=false;S.offer=null;S.history.push("Moved from "+old+" to "+S.division+".");save();screen="career";render()}
function render(){try{if(!S)return creator();migrate();let html;if(screen==="home")html=home();else if(screen==="offers")html=starterOffers();else if(screen==="career")html=career();else if(screen==="fight")html=fight();else if(screen==="contract")html=contract();else if(screen==="result")html=resultScreen();else if(screen==="rankings")html=rankings();else if(screen==="record")html=record();else if(screen==="weight")html=weightScreen();else html=more();root.innerHTML=html;bind()}catch(err){root.innerHTML='<div class="app"><div class="error"><b>Game Error</b><br>'+String(err.message||err)+'</div><button class="btn danger" id="hardReset" style="margin-top:12px">Reset career</button></div>';const hardReset=document.getElementById("hardReset");if(hardReset)hardReset.onclick=()=>{localStorage.removeItem("path_ufc_v2");S=null;creator()}}}
function bind(){root.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{const t=b.dataset.tab;screen=t==="home"?"home":t==="career"?"career":t==="fight"?"fight":t==="rankings"?"rankings":"more";render()});root.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==="offers")screen="offers";else if(a==="contract")screen="contract";else if(a==="fight")screen="fight";else{if(!S.contract)createContractOffer();else createFightOffer();screen=S.contractOffer?"contract":"fight"}render()});root.querySelectorAll("[data-pick-offer]").forEach(b=>b.onclick=()=>{const o=S.offers[+b.dataset.pickOffer];S.contract={org:o.org,total:o.fights,left:o.fights,base:o.base};S.org=o.org;S.offers=[];S.history.push("Signed first professional deal: "+o.fights+" fights with "+o.org+" at "+money(o.base)+" per fight.");createFightOffer();save();screen="home";render()});root.querySelectorAll("[data-camp]").forEach(b=>b.onclick=()=>{S.camp=b.dataset.camp;save();render()});document.getElementById("sign")?.addEventListener("click",()=>{const o=S.contractOffer;S.contract={org:o.org,total:o.fights,left:o.fights,base:o.base};S.org=o.org;S.contractOffer=null;S.history.push("Signed a "+o.fights+"-fight contract with "+o.org+" for "+money(o.base)+" per fight.");createFightOffer();save();screen="home";render()});document.getElementById("negotiate")?.addEventListener("click",()=>{const o=S.contractOffer;S.negotiations++;if(Math.random()<.72){o.base=Math.round(o.base*rnd(108,122)/100);S.history.push("Negotiated a higher purse with "+o.org+".")}else{S.history.push(o.org+" withdrew its offer after negotiations.");S.contractOffer=null;createContractOffer()}save();render()});document.getElementById("reject")?.addEventListener("click",()=>{S.history.push("Declined a contract offer from "+S.contractOffer.org+".");S.contractOffer=null;createContractOffer();save();render()});document.getElementById("acceptFight")?.addEventListener("click",simulateFight);document.getElementById("declineFight")?.addEventListener("click",()=>{S.declines++;S.history.push("Declined a fight with "+S.offer.opp+" at "+S.offer.org+".");if(S.declines%3===0)S.popularity=clamp(S.popularity-2,0,100);S.offer=null;createFightOffer();save();render()});document.getElementById("afterResult")?.addEventListener("click",()=>{if(S.contractOffer)screen="contract";else{if(S.contract)createFightOffer();screen=S.offer?"fight":"home"}render()});root.querySelectorAll("[data-more]").forEach(b=>b.onclick=()=>{const m=b.dataset.more;if(m==="record")screen="record";else if(m==="weight")screen="weight";else if(m==="new"){if(confirm("Start a new career?")){localStorage.removeItem("path_ufc_v2");S=null;return creator()}}render()});document.getElementById("down")?.addEventListener("click",()=>changeWeight(-1));document.getElementById("up")?.addEventListener("click",()=>changeWeight(1))}
load();render();
</script>
</body>
