<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Path to the UFC</title><style>
:root{--bg:#090b11;--p:#151923;--c:#1d222d;--line:#353b49;--t:#f5f6fa;--m:#a7adbb;--a:#ef2d25;--g:#42c96b;--gold:#f1b817}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% 0,#321512 0,transparent 34%),linear-gradient(180deg,#0b0d13,#08090e 70%);color:var(--t);font-family:system-ui,-apple-system,Arial}button,input,select{font:inherit}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}aside{padding:20px 12px;background:#0d0d0d;border-right:1px solid var(--line)}.brand{font-size:21px;font-weight:950;margin:0 8px 20px}.brand small{display:block;color:var(--a);font-size:9px;letter-spacing:4px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:var(--m);text-align:left;padding:11px;border-radius:7px}.nav button.on,.nav button:hover{background:#242424;color:#fff;box-shadow:inset 3px 0 var(--a)}main{padding:24px;max-width:1150px;width:100%;margin:auto}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.top{margin-bottom:18px}.k{font-size:10px;letter-spacing:2px;color:var(--a);font-weight:900}h1,h2,h3,p{margin-top:0}.muted{color:var(--m)}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}.card{background:linear-gradient(145deg,#202531,#171b24);border:1px solid #3a4050;border-radius:24px;padding:20px;box-shadow:0 14px 30px #0005}.card:before{content:"";display:block;height:3px;margin:-20px -20px 18px;border-radius:24px 24px 0 0;background:linear-gradient(90deg,#ef2d25,#ff7a00,transparent 78%)}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}.rating{font-size:58px;font-weight:950;color:white;line-height:1;background:linear-gradient(145deg,#b98200,#725000);border-radius:24px;padding:16px;text-align:center;min-width:108px}.big{font-size:31px;font-weight:950}.chips,.actions{display:flex;gap:7px;flex-wrap:wrap}.chip{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:5px 8px}.bar{height:7px;background:#333;border-radius:8px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--a)}.primary,.alt,.decline{min-height:48px;padding:12px 17px;border-radius:16px;font-weight:850;cursor:pointer}.primary{background:var(--a);border:0;color:white}.alt{background:#292929;border:1px solid #484848;color:white}.decline{background:#171717;border:1px solid #633;color:#ffbaba}.offer{border:2px solid #8f2927}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #303030;text-align:left}th{font-size:10px;color:var(--m)}.win{color:var(--g)}.loss{color:#ff7474}.feed{padding:8px 0;border-bottom:1px solid #303030}.modal{position:fixed;inset:0;background:#080a10;overflow-y:auto;padding:18px;z-index:5}.box{width:min(780px,96vw);margin:18px auto 48px;background:transparent;border:0;padding:0}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{font-size:12px;color:var(--m)}input,select{display:block;width:100%;margin-top:5px;padding:10px;background:#0c0c0c;color:white;border:1px solid #444;border-radius:6px}
.stylegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.stylepick{min-height:92px;text-align:left;padding:14px;border-radius:18px;background:#272c38;color:white;border:1px solid #3c4352}.stylepick b,.stylepick small{display:block}.stylepick small{color:var(--m);margin-top:7px;line-height:1.35}.stylepick.selected{border:2px solid var(--a);background:#302326}@media(max-width:760px){.shell{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(3,1fr)}main{padding:14px}.s3,.s4,.s6,.s8{grid-column:span 12}.form{grid-template-columns:1fr}.stylegrid{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}}
</style></head><body><div id="app"></div><script>
"use strict";
const DIVS=[["Flyweight",125],["Bantamweight",135],["Featherweight",145],["Lightweight",155],["Welterweight",170],["Middleweight",185],["Light Heavyweight",205],["Heavyweight",265]];
const ORGS=["Regional MMA","LFA","Cage Warriors","PFL","ONE Championship","UFC","Professional Boxing"];
const STYLES=["Boxer","Kickboxer","Muay Thai","Wrestler","Brazilian Jiu-Jitsu","Judo","Karate","Well-Rounded"];
const DEALS={"Regional MMA":[1,3,500,2500],"LFA":[2,4,3000,12000],"Cage Warriors":[2,5,3500,14000],"PFL":[2,5,8000,40000],"ONE Championship":[2,5,7000,35000],"UFC":[3,5,12000,65000],"Professional Boxing":[1,4,1500,25000]};
const UFC={Flyweight:[["Joshua Van",18,2,66,125],["Alexandre Pantoja",30,6,65,125],["Brandon Moreno",23,9,67,125]],Bantamweight:[["Petr Yan",20,5,67,135],["Merab Dvalishvili",19,5,66,135],["Cory Sandhagen",18,7,71,135]],Featherweight:[["Alexander Volkanovski",28,4,66,145],["Diego Lopes",27,7,71,145]],Lightweight:[["Justin Gaethje",28,5,71,155],["Ilia Topuria",17,0,67,155],["Max Holloway",27,8,71,155],["Charles Oliveira",36,11,70,155]],Welterweight:[["Islam Makhachev",29,1,70,170],["Ian Machado Garry",17,1,75,170]],Middleweight:[["Sean Strickland",31,7,73,185],["Dricus Du Plessis",24,3,73,185],["Khamzat Chimaev",15,1,74,185]],"Light Heavyweight":[["Carlos Ulberg",15,1,76,205],["Alex Pereira",13,3,76,205],["Jiri Prochazka",32,6,75,205]],Heavyweight:[["Tom Aspinall",15,3,77,250],["Ciryl Gane",13,3,76,247]]};
const NAV=["Home","Next","Career","Fight Offer","Training","Rankings","Fighter","Roster","Record","Organizations","History"];let S=null,page="Home";const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[rnd(0,a.length-1)],clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function save(){try{localStorage.setItem("path_ufc_v1",JSON.stringify(S))}catch(e){}}function load(){try{let x=localStorage.getItem("path_ufc_v1");if(x)S=JSON.parse(x)}catch(e){}}
function ht(n){return Math.floor(n/12)+"' "+n%12+'"'}function fresh(n,age,h,d,style){return{name:n,age,height:h,division:d[0],limit:d[1],style:style||"Well-Rounded",org:"Regional MMA",overall:rnd(56,64),potential:rnd(82,96),striking:rnd(55,68),grappling:rnd(52,68),cardio:rnd(56,70),durability:rnd(58,72),popularity:5,rank:null,wins:0,losses:0,ko:0,sub:0,dec:0,money:0,year:2026,fights:[],history:["Turned professional in 2026."],offer:null,contract:{org:"Regional MMA",total:1,left:1,base:1200},contractOffer:null,declines:0,camp:"Balanced",rankPoints:0,ufcRank:null,champion:false,negotiations:0,shortNotice:0}}
function creator(){document.getElementById("app").innerHTML='<div class="modal"><div class="box"><div class="k">PATH TO THE UFC · CAREER MODE</div><h1>Create your fighter</h1><p class="muted">Your identity, division and fighting style shape the entire career.</p><div class="card"><div class="k">IDENTITY</div><h2>Who are you?</h2><div class="form"><label>Fighter name<input id="nm" value="Colt Haines"></label><label>Starting age<select id="ag">'+[18,19,20,21,22].map(x=>'<option>'+x+'</option>').join("")+'</select></label><label>Height<select id="he">'+Array.from({length:16},(_,i)=>'<option value="'+(64+i)+'">'+ht(64+i)+'</option>').join("")+'</select></label><label>Weight class<select id="di">'+DIVS.map((x,i)=>'<option value="'+i+'">'+x[0]+' · '+x[1]+' lb</option>').join("")+'</select></label></div></div><br><div class="card"><div class="k">FIGHTING IDENTITY</div><h2>Choose how you fight</h2><p class="muted">This is a permanent starting archetype. It affects development and which training camps give you the biggest matchup advantage.</p><div class="stylegrid">'+STYLES.map((x,i)=>'<button type="button" class="stylepick '+(i===7?'selected':'')+'" data-style="'+x+'"><b>'+({Boxer:"🥊",Kickboxer:"🦵","Muay Thai":"🔥",Wrestler:"🤼","Brazilian Jiu-Jitsu":"🥋",Judo:"🥋",Karate:"🥋","Well-Rounded":"⚖️"}[x])+' '+x+'</b><small>'+({Boxer:"Sharp hands and striking power",Kickboxer:"Punch-kick combinations and range","Muay Thai":"Pressure striking and clinch work",Wrestler:"Takedowns and control","Brazilian Jiu-Jitsu":"Submission and ground specialist",Judo:"Throws and grappling control",Karate:"Movement, timing and counters","Well-Rounded":"Balanced everywhere; no major weakness"}[x])+'</small></button>').join("")+'</div><input type="hidden" id="sty" value="Well-Rounded"></div><br><button class="primary" style="width:100%" id="start">Confirm identity →</button></div></div>';document.querySelectorAll(".stylepick").forEach(b=>b.onclick=()=>{document.querySelectorAll(".stylepick").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");document.getElementById("sty").value=b.dataset.style});document.getElementById("start").onclick=()=>{S=fresh(document.getElementById("nm").value||"Fighter",+document.getElementById("ag").value,+document.getElementById("he").value,DIVS[+document.getElementById("di").value],document.getElementById("sty").value);makeOffer();save();page="Home";render()}}
function shell(x){return '<div class="shell"><aside><div class="brand">🥊 PATH TO<small>THE UFC</small></div><div class="nav">'+NAV.map(n=>'<button data-nav="'+n+'" class="'+(page===n?'on':'')+'">'+n+'</button>').join("")+'</div></aside><main><div class="top"><div><div class="k">'+S.year+' · '+S.org+'</div><h1>'+page+'</h1></div><div class="chips"><span class="chip">'+S.division+'</span><span class="chip">'+S.wins+'-'+S.losses+'</span><span class="chip">'+S.popularity+' Fame</span></div></div>'+x+'</main></div>'}
function normalize(){if(!S)return;if(!S.style)S.style="Well-Rounded";if(!S.camp)S.camp="Balanced";if(S.rankPoints==null)S.rankPoints=0;if(S.ufcRank===undefined)S.ufcRank=null;if(S.champion==null)S.champion=false;if(S.negotiations==null)S.negotiations=0;if(S.shortNotice==null)S.shortNotice=0;if(!S.contract)S.contract=null}
function home(){let next=S.contractOffer?"Contract decision":S.offer?"Fight decision":"New opportunity";return '<div class="grid"><div class="card s8"><div class="k">CAREER HUB</div><div class="row"><div><h1>'+S.name+'</h1><div class="chips"><span class="chip">'+S.org+'</span><span class="chip">'+S.division+'</span><span class="chip">'+S.style+'</span><span class="chip">'+S.wins+'-'+S.losses+'</span></div></div><div class="rating">'+S.overall+'</div></div><br><button class="primary" id="continueCareer">CONTINUE CAREER →</button></div><div class="card s4 offer"><div class="k">NEXT EVENT</div><h2>'+next+'</h2><p>'+(S.contractOffer?S.contractOffer.org+" contract":S.offer?S.offer.opp+" · "+S.offer.org:"Advance time")+'</p><button class="primary" id="continueCareer2">Continue</button></div><div class="card s3"><div class="big">'+S.wins+'</div><span class="muted">Wins</span></div><div class="card s3"><div class="big">'+S.losses+'</div><span class="muted">Losses</span></div><div class="card s3"><div class="big">'+(S.champion?"C":S.ufcRank||"—")+'</div><span class="muted">UFC Rank</span></div><div class="card s3"><div class="big">'+S.popularity+'</div><span class="muted">Fame</span></div><div class="card s6"><div class="k">CURRENT DEAL</div><h3>'+(S.contract?S.contract.org:"Free Agent")+'</h3><p>'+(S.contract?S.contract.left+" fights remaining · $"+S.contract.base.toLocaleString()+" base purse":"Waiting for a promotion contract")+'</p></div><div class="card s6"><div class="k">LATEST NEWS</div>'+S.history.slice(-3).reverse().map(x=>'<div class="feed">'+x+'</div>').join("")+'</div></div>'}
function nextStep(){page=S.contractOffer||S.offer?"Fight Offer":"Career";render()}
function render(){if(!S)return creator();normalize();let f={Home:home,Next:home,Career:career,"Fight Offer":offerView,Training:training,Rankings:rankings,Fighter:fighter,Roster:roster,Record:record,Organizations:orgs,History:history};document.getElementById("app").innerHTML=shell((f[page]||career)());document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{page=b.dataset.nav;render()});bind()}
function meter(n,v){return '<div style="margin:8px 0" class="mini">'+n+' <b style="float:right">'+v+'</b><div class="bar"><i style="width:'+v+'%"></i></div></div>'}
function career(){return '<div class="grid"><div class="card s8"><div class="row"><div><div class="k">'+S.division+' · '+S.org+'</div><h2>'+S.name+'</h2><div class="chips"><span class="chip">Age '+S.age+'</span><span class="chip">'+ht(S.height)+'</span><span class="chip">'+S.wins+'-'+S.losses+'</span></div></div><div class="rating">'+S.overall+'</div></div></div><div class="card s4 offer"><div class="k">NEXT DECISION</div><h2>'+(S.offer?"Fight Offer":"Waiting for offer")+'</h2><p>'+(S.offer?S.offer.opp+" · "+S.offer.org:"Advance career")+'</p><button class="primary" data-go="Fight Offer">View Offer</button></div><div class="card s3"><div class="big">'+S.wins+'</div><span class="muted">Wins</span></div><div class="card s3"><div class="big">'+S.losses+'</div><span class="muted">Losses</span></div><div class="card s3"><div class="big">'+S.popularity+'</div><span class="muted">Popularity</span></div><div class="card s3"><div class="big">$'+S.money.toLocaleString()+'</div><span class="muted">Career earnings</span></div><div class="card s6"><div class="k">CAREER STATUS</div><p><b>Style:</b> '+S.style+'</p><p><b>Camp:</b> '+S.camp+'</p><p><b>UFC ranking:</b> '+(S.champion?"Champion":S.ufcRank?"#"+S.ufcRank:"Unranked")+'</p></div><div class="card s6"><div class="k">DEVELOPMENT</div>'+meter("Striking",S.striking)+meter("Grappling",S.grappling)+meter("Cardio",S.cardio)+meter("Durability",S.durability)+'</div><div class="card s6"><div class="k">CAREER FEED</div>'+S.history.slice(-5).reverse().map(x=>'<div class="feed">'+x+'</div>').join("")+'</div></div>'}
function realOpp(){let a=UFC[S.division]||[];return a.length?pick(a):["UFC Opponent",10,3,70,S.limit]}
function generated(){let first=["Marcus","Dante","Eli","Mateo","Andre","Niko","Caleb","Roman","Jalen","Victor"],last=["Silva","Torres","Bennett","Costa","Reed","Santos","Price","Navarro","King","Morales"];return[pick(first)+" "+pick(last),rnd(2,18),rnd(0,7),rnd(64,77),S.limit]}
function maybeContract(){if(S.contract&&S.contract.left>0)return false;let choices=["Regional MMA"];if(S.wins>=3)choices.push("LFA","Cage Warriors");if(S.wins>=5)choices.push("PFL","ONE Championship");if(S.wins>=7&&S.popularity>=35)choices.push("UFC");if(S.wins>=4)choices.push("Professional Boxing");let org=pick(choices),d=DEALS[org],fights=rnd(d[0],d[1]),base=rnd(d[2],d[3]);S.contractOffer={org,fights,base};return true}
function contractView(){let o=S.contractOffer;return '<div class="grid"><div class="card s12"><div class="k">CAREER OPPORTUNITY</div><h1>Promotion offer</h1><p class="muted">Choose the project that makes the most sense for your career. Money, contract length and promotion level all matter.</p></div><div class="card offer s12"><div class="k">CONTRACT OFFER</div><h2>'+o.org+' wants to sign you</h2><table><tr><th>LENGTH</th><th>BASE PURSE</th><th>DIVISION</th></tr><tr><td>'+o.fights+' fights</td><td>$'+o.base.toLocaleString()+' / fight</td><td>'+S.division+'</td></tr></table><br><div class="actions"><button class="primary" id="signContract">Accept Contract</button><button class="alt" id="negotiateContract">Negotiate</button><button class="decline" id="rejectContract">Decline Contract</button></div><p class="muted">Negotiating can improve the purse, but the promotion can pull the offer.</p></div></div>'}
function makeOffer(){if(maybeContract())return;let org=S.contract?S.contract.org:S.org;let o=org==="UFC"?realOpp():generated(),base=S.contract&&S.contract.org===org?S.contract.base:(org==="UFC"?rnd(12000,45000):org==="Regional MMA"?rnd(800,2500):rnd(3000,12000));S.offer={org,opp:o[0],oppWins:o[1],oppLosses:o[2],oppHeight:o[3],weight:o[4],pay:base,rounds:S.popularity>75?5:3,days:rnd(35,100)}}
function offerView(){if(!S.offer&&!S.contractOffer)makeOffer();if(S.contractOffer)return contractView();let o=S.offer;return '<div class="grid"><div class="card s8 offer"><div class="k">CONTRACT OFFER · '+o.org+'</div><h2>'+S.name+' vs '+o.opp+'</h2><div class="chips"><span class="chip">'+S.division+'</span><span class="chip">'+o.rounds+' rounds</span><span class="chip">'+o.days+' days away</span></div><br><table><tr><th>OPPONENT</th><th>RECORD</th><th>HEIGHT</th><th>PURSE</th></tr><tr><td>'+o.opp+'</td><td>'+o.oppWins+'-'+o.oppLosses+'</td><td>'+ht(o.oppHeight)+'</td><td>$'+o.pay.toLocaleString()+'</td></tr></table><br><div class="actions"><button class="primary" id="accept">Accept Fight</button><button class="decline" id="decline">Decline Fight</button></div></div><div class="card s4"><div class="k">CAREER CHOICE</div><h3>Every offer matters</h3><p class="muted">Winning builds your overall, reputation and opportunities. Declining can lead to a different matchup, but too many declines can slow your momentum.</p></div></div>'}
function accept(){let o=S.offer,oppO=clamp(55+o.oppWins*1.6-o.oppLosses+rnd(-4,5),52,94),you=S.overall+S.cardio*.08+campBonus()+rnd(-16,16),them=oppO+rnd(-13,13),win=you>=them,method=pick(win?["Decision","KO/TKO","Submission"]:["Decision","KO/TKO","Submission"]),round=method==="Decision"?o.rounds:rnd(1,o.rounds);if(win){S.wins++;if(o.org==="UFC"){S.rankPoints=clamp(S.rankPoints+rnd(8,16)+(o.oppWins>20?5:0),0,120);S.ufcRank=S.rankPoints>=100?1:S.rankPoints>=90?3:S.rankPoints>=78?5:S.rankPoints>=65?8:S.rankPoints>=50?12:S.rankPoints>=38?15:null;if(S.rankPoints>=110){S.champion=true;S.ufcRank=null}}if(method==="KO/TKO")S.ko++;else if(method==="Submission")S.sub++;else S.dec++;S.popularity=clamp(S.popularity+rnd(4,11),0,100);if(S.overall<S.potential&&Math.random()<.7)S.overall++}else{S.losses++;if(o.org==="UFC"){S.rankPoints=clamp(S.rankPoints-rnd(4,10),0,120);if(S.rankPoints<38)S.ufcRank=null}S.popularity=clamp(S.popularity-rnd(0,4),0,100)}S.money+=o.pay;S.org=o.org;if(S.contract&&S.contract.org===o.org)S.contract.left=Math.max(0,S.contract.left-1);let r={year:S.year,opp:o.opp,org:o.org,result:win?"W":"L",method,round,pay:o.pay};S.fights.push(r);S.history.push((win?"Defeated ":"Lost to ")+o.opp+" via "+method+" in Round "+round+" ("+o.org+").");S.year+=Math.random()<.25?1:0;S.age=S.age+(S.year-2026>S.age-18?0:0);S.offer=null;if(S.contract&&S.contract.left===0)S.history.push("Completed "+S.contract.total+"-fight contract with "+S.contract.org+".");makeOffer();save();page=S.contractOffer?"Fight Offer":"Home";render()}
function campBonus(){let b=0;if(S.camp==="Cardio")b+=3;if(S.camp==="Balanced")b+=2;if(S.camp==="Striking"&&["Boxer","Kickboxer","Muay Thai","Karate"].includes(S.style))b+=6;if((S.camp==="Wrestling"||S.camp==="Grappling")&&["Wrestler","Brazilian Jiu-Jitsu","Judo"].includes(S.style))b+=6;if(S.camp==="Recovery")b+=1;return b}
function decline(){S.declines++;S.popularity=clamp(S.popularity-(S.declines%3===0?2:0),0,100);S.history.push("Declined a fight offer from "+S.offer.org+" against "+S.offer.opp+".");S.offer=null;makeOffer();save();page="Home";render()}
function training(){let o=S.offer;return '<div class="grid"><div class="card s8"><div class="k">FIGHT CAMP</div><h2>Choose your focus</h2><p class="muted">'+(o?"Preparing for "+o.opp+" in "+o.days+" days.":"Set your default camp approach.")+'</p><div class="actions"><button class="alt" data-camp="Balanced">Balanced</button><button class="alt" data-camp="Striking">Striking</button><button class="alt" data-camp="Wrestling">Wrestling</button><button class="alt" data-camp="Grappling">Grappling</button><button class="alt" data-camp="Cardio">Cardio</button><button class="alt" data-camp="Recovery">Recovery</button></div></div><div class="card s4"><div class="k">CURRENT PLAN</div><h2>'+S.camp+'</h2><p class="muted">Your style and camp affect matchup performance. Specializing helps one area but a balanced camp is safer.</p></div></div>'}
function rankings(){let pts=S.rankPoints||0;return '<div class="grid"><div class="card s4"><div class="k">UFC STATUS</div><div class="rating">'+(S.champion?"C":S.ufcRank||"—")+'</div><h3>'+(S.champion?"Champion":S.ufcRank?"Ranked #"+S.ufcRank:"Unranked")+'</h3><p class="muted">'+pts+' ranking points</p></div><div class="card s8"><h2>'+S.division+' title path</h2><p>UFC wins build ranking points. Strong wins can move you into the Top 15, then toward a title eliminator and championship opportunity.</p><div class="bar"><i style="width:'+clamp(pts,0,100)+'%"></i></div><br><p class="muted">This career ranking is simulated independently from the real-world UFC rankings.</p></div></div>'}
function fighter(){return '<div class="grid"><div class="card s4"><div class="rating">'+S.overall+'</div><h2>'+S.name+'</h2><p>'+S.division+' · '+ht(S.height)+' · '+S.limit+' lb</p><p class="muted">Age '+S.age+' · Potential '+S.potential+'</p></div><div class="card s8">'+meter("Striking",S.striking)+meter("Grappling",S.grappling)+meter("Cardio",S.cardio)+meter("Durability",S.durability)+'</div></div>'}
function roster(){let a=UFC[S.division]||[];return '<div class="card"><div class="k">UFC '+S.division.toUpperCase()+' ROSTER SAMPLE</div><h2>Real-world opponents</h2><p class="muted">The UFC side uses real fighter names and baseline profile information; the career simulation then develops independently.</p><table><tr><th>FIGHTER</th><th>RECORD</th><th>HEIGHT</th><th>WEIGHT</th></tr>'+a.map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+'-'+x[2]+'</td><td>'+ht(x[3])+'</td><td>'+x[4]+' lb</td></tr>').join("")+'</table></div>'}
function record(){return '<div class="card"><h2>Professional Record · '+S.wins+'-'+S.losses+'</h2><table><tr><th>RESULT</th><th>OPPONENT</th><th>ORG</th><th>METHOD</th><th>ROUND</th><th>PAY</th></tr>'+S.fights.slice().reverse().map(x=>'<tr><td class="'+(x.result==="W"?"win":"loss")+'">'+x.result+'</td><td>'+x.opp+'</td><td>'+x.org+'</td><td>'+x.method+'</td><td>'+x.round+'</td><td>$'+x.pay.toLocaleString()+'</td></tr>').join("")+'</table></div>'}
function changeWeight(dir){let i=DIVS.findIndex(x=>x[0]===S.division),n=clamp(i+dir,0,DIVS.length-1);if(n===i)return;let old=S.division;S.division=DIVS[n][0];S.limit=DIVS[n][1];S.ufcRank=null;S.rankPoints=Math.floor((S.rankPoints||0)*.45);S.champion=false;S.offer=null;S.history.push("Moved from "+old+" to "+S.division+".");makeOffer();save();render()}
function orgs(){return '<div class="grid">'+ORGS.map(o=>'<div class="card s4"><div class="k">PROMOTION</div><h3>'+o+'</h3><p class="muted">'+(o===S.org?"Current promotion":o==="UFC"?"Top MMA destination":"Possible career destination")+'</p></div>').join("")+'</div><div class="card s12"><div class="k">CAREER MOVE</div><h3>Change Weight Class</h3><div class="actions"><button class="alt" id="moveDown">Move Down</button><button class="alt" id="moveUp">Move Up</button></div><p class="muted">Changing divisions resets your UFC ranking progress and creates new opponents.</p></div>'}
function history(){return '<div class="card"><h2>Career Timeline</h2>'+S.history.slice().reverse().map(x=>'<div class="feed">'+x+'</div>').join("")+'<br><button class="decline" id="reset">New Career</button></div>'}
function bind(){let cc=document.getElementById("continueCareer");if(cc)cc.onclick=nextStep;let cc2=document.getElementById("continueCareer2");if(cc2)cc2.onclick=nextStep;document.querySelectorAll("[data-camp]").forEach(b=>b.onclick=()=>{S.camp=b.dataset.camp;S.history.push("Training camp focus: "+S.camp+".");save();page="Fight Offer";render()});let up=document.getElementById("moveUp");if(up)up.onclick=()=>changeWeight(1);let dn=document.getElementById("moveDown");if(dn)dn.onclick=()=>changeWeight(-1);let sc=document.getElementById("signContract");if(sc)sc.onclick=()=>{let o=S.contractOffer;S.contract={org:o.org,total:o.fights,left:o.fights,base:o.base};S.org=o.org;S.history.push("Signed a "+o.fights+"-fight contract with "+o.org+".");S.contractOffer=null;makeOffer();save();page="Home";render()};let ng=document.getElementById("negotiateContract");if(ng)ng.onclick=()=>{S.negotiations++;let o=S.contractOffer;if(Math.random()<.7){o.base=Math.round(o.base*rnd(108,125)/100);S.history.push("Negotiated a better offer from "+o.org+".");}else{S.history.push(o.org+" pulled its contract offer after negotiations.");S.contractOffer=null;S.contract=null;makeOffer()}save();render()};let rc=document.getElementById("rejectContract");if(rc)rc.onclick=()=>{S.history.push("Declined a contract from "+S.contractOffer.org+".");S.contractOffer=null;S.contract=null;makeOffer();save();page="Home";render()};document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});let a=document.getElementById("accept");if(a)a.onclick=accept;let d=document.getElementById("decline");if(d)d.onclick=decline;let r=document.getElementById("reset");if(r)r.onclick=()=>{if(confirm("Start a new career?")){localStorage.removeItem("path_ufc_v1");S=null;creator()}}}
window.addEventListener("error",e=>document.getElementById("app").innerHTML='<main><div class="card"><h1>Game Error</h1><p>'+e.message+'</p></div></main>');load();render();
</script></body></htm
