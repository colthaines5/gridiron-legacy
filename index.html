<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gridiron Legacy</title><style>
:root{--bg:#070b10;--panel:#111a23;--card:#15212c;--line:#2b3b49;--text:#f2f6f8;--muted:#91a3b2;--lime:#b8f34a;--red:#ff7070}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,Arial}button,input,select{font:inherit}.shell{display:grid;grid-template-columns:215px 1fr;min-height:100vh}aside{background:#0a1016;border-right:1px solid var(--line);padding:20px 12px}.brand{font-size:20px;font-weight:950;margin:0 8px 20px}.brand small{display:block;color:var(--lime);font-size:9px;letter-spacing:4px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:var(--muted);padding:11px;text-align:left;border-radius:8px;cursor:pointer}.nav button.on,.nav button:hover{background:#18242e;color:#fff;box-shadow:inset 3px 0 var(--lime)}main{padding:24px;max-width:1180px;width:100%;margin:auto}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.top{margin-bottom:18px}.k{font-size:10px;letter-spacing:2px;color:var(--lime);font-weight:900}h1,h2,h3,p{margin-top:0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:12px}.card{background:linear-gradient(#15212c,#101820);border:1px solid var(--line);border-radius:12px;padding:16px}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}.rating{font-size:62px;font-weight:950;color:var(--lime);line-height:1}.big{font-size:31px;font-weight:950}.chips,.actions{display:flex;gap:7px;flex-wrap:wrap}.chip{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:5px 8px}.bar{height:7px;background:#273540;border-radius:8px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--lime)}.primary,.alt,.danger{padding:10px 13px;border-radius:8px;font-weight:850;cursor:pointer}.primary{background:var(--lime);border:0;color:#091008}.alt{background:#1b2935;border:1px solid #3b5162;color:white}.danger{background:#351c21;border:1px solid #6b333c;color:#ffd8d8}.choice{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:13px;margin:9px 0;background:#111b24}.choice h3,.choice p{margin:0}.choice p{color:var(--muted);font-size:12px;margin-top:4px}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #263541;text-align:left}th{font-size:10px;color:var(--muted)}.win{color:var(--lime)}.loss{color:var(--red)}.feed{padding:8px 0;border-bottom:1px solid #263541}.modal{position:fixed;inset:0;background:#05080def;display:grid;place-items:center;padding:18px;z-index:5}.box{width:min(820px,96vw);max-height:92vh;overflow:auto;background:#101923;border:1px solid #3b5061;border-radius:14px;padding:22px}.form,.schools{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{font-size:12px;color:var(--muted)}input,select{display:block;width:100%;margin-top:5px;padding:10px;background:#081119;color:white;border:1px solid #3b5061;border-radius:7px}.schools{margin-top:10px}.schools button{text-align:left}.mini{font-size:12px}
@media(max-width:760px){.shell{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(3,1fr)}main{padding:14px}.s3,.s4,.s6,.s8{grid-column:span 12}.form,.schools{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div id="app"></div><script>
"use strict";
const POS=["QB","RB","FB","WR","TE","LT","LG","C","RG","RT","EDGE","DT","NT","MLB","OLB","CB","FS","SS","K","P"];
const HS=[["Seminole Warhawks",78,"Balanced"],["Osceola Warriors",72,"Spread"],["Largo Packers",76,"Power"],["Pinellas Park Patriots",70,"Option"],["Boca Ciega Pirates",68,"Spread"],["St. Petersburg Green Devils",74,"Balanced"],["Clearwater Tornadoes",73,"Air Raid"],["Countryside Cougars",71,"Spread"],["Palm Harbor Hurricanes",77,"Pro Style"],["East Lake Eagles",84,"Balanced"],["Lakewood Spartans",86,"Speed"],["Dunedin Falcons",66,"Balanced"],["Gibbs Gladiators",75,"Spread"],["Northeast Vikings",73,"Balanced"],["Tarpon Springs Spongers",67,"Power"],["Sickles Gryphons",80,"Spread"],["Plant Panthers",87,"Pro Style"],["Armwood Hawks",89,"Power"],["Jesuit Tigers",92,"Pro Style"],["Gaither Cowboys",82,"Spread"]];
const COL=["Alabama","Georgia","Ohio State","Michigan","Texas","Florida","Florida State","Miami","LSU","Clemson","Oregon","Penn State","Notre Dame","USC","Tennessee","Auburn","Oklahoma","Texas A&M","Ole Miss","Utah","Iowa","Wisconsin","Louisville","UCF","South Florida","Boise State","Memphis","Tulane"];
const PRO=["Arizona","Atlanta","Baltimore","Buffalo","Carolina","Chicago","Cincinnati","Cleveland","Dallas","Denver","Detroit","Green Bay","Houston","Indianapolis","Jacksonville","Kansas City","Las Vegas","LA Chargers","LA Rams","Miami","Minnesota","New England","New Orleans","NY Giants","NY Jets","Philadelphia","Pittsburgh","San Francisco","Seattle","Tampa Bay","Tennessee","Washington"];
const NAV=["Career","Week","Schedule","Player","Team","Recruiting","Transfer","History"];let S=null,page="Career";
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[rnd(0,a.length-1)],clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function save(){try{localStorage.setItem("gl5",JSON.stringify(S))}catch(e){}}function load(){try{let x=localStorage.getItem("gl5");if(x)S=JSON.parse(x)}catch(e){}}
function ht(n){return Math.floor(n/12)+"' "+n%12+'"'}function hsd(n){return HS.find(x=>x[0]===n)||[n,75,"Balanced"]}function grade(){return S.phase==="HS"?["Freshman","Sophomore","Junior","Senior"][S.grade-9]:S.phase}function role(){return ["","Starter","Rotation","Backup","JV / Special Teams","Developmental"][S.depth]}
function fresh(name,pos,h,w,team){return{name,pos,height:h,weight:w,team,phase:"HS",grade:9,age:14,year:2026,ovr:rnd(48,57),pot:rnd(79,96),coach:32,energy:100,morale:72,academics:76,rep:0,stars:0,depth:5,xp:0,record:[0,0],stats:{g:0,yds:0,td:0,tkl:0,sck:0,int:0},season:{g:0,yds:0,td:0,tkl:0,sck:0,int:0},schedule:[],offers:[],history:[],news:["Freshman year begins. Earn your spot."],decision:null,last:null,transfers:0}}
function makeSchedule(){S.schedule=[];let pool=HS.filter(x=>x[0]!==S.team),used=[];for(let w=1;w<=10;w++){let a=pool.filter(x=>!used.includes(x[0]));let o=pick(a.length?a:pool);used.push(o[0]);S.schedule.push({week:w,opp:o[0],home:Math.random()<.5,played:false})}}
function creator(){document.getElementById("app").innerHTML='<div class="modal"><div class="box"><div class="k">NEW CAREER · YEAR 1</div><h1>Start as a Freshman</h1><p class="muted">Choose your high school. Earn snaps, make player decisions, transfer if you want, get recruited, and work toward college and the NFL.</p><div class="form"><label>Name<input id="nm" value="Colt Haines"></label><label>Position<select id="po">'+POS.map(x=>'<option>'+x+'</option>').join("")+'</select></label><label>Height<select id="he">'+Array.from({length:14},(_,i)=>'<option value="'+(65+i)+'">'+ht(65+i)+'</option>').join("")+'</select></label><label>Weight<input id="we" type="number" min="130" max="350" value="185"></label></div><h3 style="margin-top:18px">Choose your high school</h3><div class="schools">'+HS.map((x,i)=>'<button class="alt" data-hs="'+i+'"><b>'+x[0]+'</b><br><span class="mini">'+x[2]+' · Program '+x[1]+'</span></button>').join("")+'</div></div></div>';document.querySelectorAll("[data-hs]").forEach(b=>b.onclick=()=>{let x=HS[+b.dataset.hs];S=fresh(document.getElementById("nm").value||"Player",document.getElementById("po").value,+document.getElementById("he").value,clamp(+document.getElementById("we").value||185,130,350),x[0]);makeSchedule();save();render()})}
function shell(x){return '<div class="shell"><aside><div class="brand">GRIDIRON<small>LEGACY</small></div><div class="nav">'+NAV.map(n=>'<button data-nav="'+n+'" class="'+(n===page?'on':'')+'">'+n+'</button>').join("")+'</div></aside><main><div class="top"><div><div class="k">'+S.year+' · '+grade()+'</div><h1>'+page+'</h1></div><div class="chips"><span class="chip">'+S.team+'</span><span class="chip">'+S.pos+'</span><span class="chip">'+S.record[0]+'-'+S.record[1]+'</span></div></div>'+x+'</main></div>'}
function render(){if(!S)return creator();let f={Career:career,Week:week,Schedule:sched,Player:player,Team:team,Recruiting:recruit,Transfer:transfer,History:history};document.getElementById("app").innerHTML=shell((f[page]||career)());document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{page=b.dataset.nav;render()});bind()}
function meter(n,v){return '<div class="mini">'+n+' <b style="float:right">'+Math.round(v)+'</b><div class="bar"><i style="width:'+clamp(v,0,100)+'%"></i></div></div>'}
function career(){let g=S.schedule.find(x=>!x.played);return '<div class="grid"><div class="card s8"><div class="row"><div><div class="k">'+grade()+' · '+S.team+'</div><h2>'+S.name+'</h2><div class="chips"><span class="chip">'+S.pos+'</span><span class="chip">'+ht(S.height)+' · '+S.weight+' lb</span><span class="chip">'+role()+'</span><span class="chip">'+(S.stars?"★".repeat(S.stars):"UNRATED")+'</span></div></div><div class="rating">'+S.ovr+'</div></div></div><div class="card s4"><div class="k">NEXT STEP</div><h2>'+(g?"Week "+g.week:"Offseason")+'</h2><p>'+(g?(g.home?"vs ":"@ ")+g.opp:"Advance to next school year")+'</p><button class="primary" data-go="'+(g?"Week":"Transfer")+'">Continue</button></div><div class="card s3">'+meter("Coach Trust",S.coach)+'</div><div class="card s3">'+meter("Energy",S.energy)+'</div><div class="card s3">'+meter("Morale",S.morale)+'</div><div class="card s3">'+meter("Academics",S.academics)+'</div><div class="card s6"><div class="k">SEASON</div><div class="row"><div><div class="big">'+S.record[0]+'-'+S.record[1]+'</div><span class="muted mini">Record</span></div><div><div class="big">'+S.season.g+'</div><span class="muted mini">Games</span></div><div><div class="big">'+S.rep+'</div><span class="muted mini">Recruiting rep</span></div></div></div><div class="card s6"><div class="k">CAREER FEED</div>'+S.news.slice(-4).reverse().map(x=>'<div class="feed mini">'+x+'</div>').join("")+'</div></div>'}
function week(){let g=S.schedule.find(x=>!x.played);if(!g)return offseason();if(S.decision)return decision();return '<div class="grid"><div class="card s8"><div class="k">WEEK '+g.week+'</div><h2>'+S.team+' '+(g.home?"vs":"@")+' '+g.opp+'</h2><p class="muted">Opponent strength '+hsd(g.opp)[1]+' · '+hsd(g.opp)[2]+'</p><h3>Choose your preparation</h3><div class="actions"><button class="primary" data-prep="practice">Extra Practice</button><button class="alt" data-prep="film">Study Film</button><button class="alt" data-prep="recover">Recover</button><button class="alt" data-prep="grades">Study</button></div></div><div class="card s4"><div class="k">YOUR ROLE</div><h2>'+role()+'</h2>'+meter("Coach Trust",S.coach)+'<br>'+meter("Energy",S.energy)+'</div><div class="card s12"><p class="muted">Fast loop: preparation → player decision → game result → next week. Your rating, role, energy, team strength and randomness all matter.</p></div></div>'}
function prep(a){if(a==="practice"){S.xp+=rnd(10,18);S.coach+=rnd(3,7);S.energy-=rnd(7,13)}if(a==="film"){S.coach+=rnd(2,5);S.energy-=2}if(a==="recover"){S.energy+=rnd(12,20);S.morale+=2}if(a==="grades"){S.academics+=rnd(5,10);S.energy-=2}S.energy=clamp(S.energy,20,100);S.coach=clamp(S.coach,0,100);S.academics=clamp(S.academics,40,100);while(S.xp>=100){S.xp-=100;if(S.ovr<S.pot)S.ovr++}S.decision=pick([{q:"Coach offers special-teams snaps.",a:"Take every snap",b:"Focus on your position",A:{coach:7,energy:-5,rep:2},B:{coach:-3,energy:3}},{q:"A teammate asks for extra reps.",a:"Stay and work",b:"Go recover",A:{coach:3,energy:-8,morale:4},B:{energy:9,morale:-1}},{q:"Big test tomorrow.",a:"Study tonight",b:"Watch more film",A:{academics:9,energy:-2},B:{coach:5,academics:-6}},{q:"Coach challenges your effort.",a:"Own it and improve",b:"Push back",A:{coach:7,morale:-2},B:{coach:-6,morale:4}}]);save();render()}
function decision(){let d=S.decision;return '<div class="card"><div class="k">PLAYER DECISION</div><h2>'+d.q+'</h2><div class="choice"><div><h3>'+d.a+'</h3><p>Changes trust, energy, morale, academics or reputation.</p></div><button class="primary" data-choice="A">Choose</button></div><div class="choice"><div><h3>'+d.b+'</h3><p>Different risk and reward.</p></div><button class="alt" data-choice="B">Choose</button></div></div>'}
function choose(k){let d=S.decision,e=d[k];Object.keys(e).forEach(x=>S[x]=clamp((S[x]||0)+e[x],0,100));S.news.push("Decision: "+(k==="A"?d.a:d.b)+".");S.decision=null;game()}
function game(){let g=S.schedule.find(x=>!x.played),op=hsd(g.opp),me=hsd(S.team),edge=me[1]-op[1]+rnd(-18,18),us=clamp(21+Math.round(edge/2)+rnd(-9,9),3,56),them=clamp(21-Math.round(edge/2)+rnd(-9,9),0,56);if(us===them)us+=3;let win=us>them;S.record[win?0:1]++;let q=S.coach+S.ovr;S.depth=q>116?1:q>99?2:q>82?3:q>65?4:5;let snaps=[0,rnd(35,65),rnd(20,45),rnd(8,25),rnd(2,12),rnd(0,5)][S.depth],perf=clamp(Math.round(S.ovr*.65+S.energy*.2+rnd(-14,16)),30,99),p={snaps,rating:perf,yds:0,td:0,tkl:0,sck:0,int:0};if(["QB","RB","FB","WR","TE"].includes(S.pos)){p.yds=Math.max(0,Math.round(snaps*(perf/100)*rnd(1,5)));p.td=snaps>8&&Math.random()<perf/105?rnd(0,2):0}else if(!["LT","LG","C","RG","RT","K","P"].includes(S.pos)){p.tkl=Math.round(snaps*(perf/100)/4);p.sck=["EDGE","DT","NT","MLB","OLB"].includes(S.pos)&&Math.random()<.35?rnd(0,2):0;p.int=["CB","FS","SS","MLB","OLB"].includes(S.pos)&&Math.random()<.14?1:0}["g","yds","td","tkl","sck","int"].forEach(k=>{let v=k==="g"?1:p[k];S.stats[k]+=v;S.season[k]+=v});S.coach=clamp(S.coach+(perf>=75?rnd(2,6):perf<55?-rnd(1,4):1),0,100);S.rep+=Math.max(0,Math.round((perf-55)/7));S.energy=clamp(S.energy-rnd(5,12),20,100);g.played=true;Object.assign(g,{result:win?"W":"L",us,them,player:p});S.last=g;S.news.push((win?"Win ":"Loss ")+us+"-"+them+" vs "+g.opp+". "+snaps+" snaps, "+perf+" rating.");if(S.grade>=10&&S.rep>20)offers();save();page="Schedule";render()}
function sched(){return '<div class="card"><table><tr><th>WK</th><th>MATCHUP</th><th>RESULT</th><th>YOUR GAME</th></tr>'+S.schedule.map(g=>'<tr><td>'+g.week+'</td><td>'+(g.home?"vs ":"@ ")+g.opp+'</td><td>'+(g.played?'<b class="'+(g.result==="W"?"win":"loss")+'">'+g.result+' '+g.us+'-'+g.them+'</b>':"—")+'</td><td>'+(g.player?g.player.snaps+" snaps · "+g.player.rating+" rating":"—")+'</td></tr>').join("")+'</table><br>'+(S.schedule.every(x=>x.played)?'<button class="primary" data-go="Transfer">Go to Offseason</button>':'<button class="primary" data-go="Week">Next Week</button>')+'</div>'}
function player(){return '<div class="grid"><div class="card s4"><div class="rating">'+S.ovr+'</div><h2>'+S.name+'</h2><p>'+S.pos+' · '+ht(S.height)+' · '+S.weight+' lb</p><p class="muted">Potential '+S.pot+' · '+grade()+'</p></div><div class="card s8"><h3>Career Stats</h3><table><tr><th>G</th><th>YDS</th><th>TD</th><th>TKL</th><th>SCK</th><th>INT</th></tr><tr><td>'+S.stats.g+'</td><td>'+S.stats.yds+'</td><td>'+S.stats.td+'</td><td>'+S.stats.tkl+'</td><td>'+S.stats.sck+'</td><td>'+S.stats.int+'</td></tr></table><br>'+meter("Coach Trust",S.coach)+'<br>'+meter("Morale",S.morale)+'<br>'+meter("Academics",S.academics)+'</div></div>'}
function team(){return '<div class="grid"><div class="card s6"><div class="k">PROGRAM</div><h2>'+S.team+'</h2><p>'+hsd(S.team)[2]+' · Strength '+hsd(S.team)[1]+'</p><p class="muted">Your current role: '+role()+'</p></div><div class="card s6"><div class="k">DEPTH CHART</div><table>'+Array.from({length:5},(_,i)=>{let n=i+1,o=clamp(hsd(S.team)[1]+rnd(-15,10),45,92);return '<tr><td>#'+n+'</td><td class="'+(n===S.depth?"win":"")+'">'+(n===S.depth?S.name+" · YOU":"Generated "+S.pos+" "+n)+'</td><td>'+(n===S.depth?S.ovr:o)+' OVR</td></tr>'}).join("")+'</table></div></div>'}
function offers(){let target=clamp(Math.floor(S.rep/12),1,8),pool=[...COL].sort(()=>Math.random()-.5);while(S.offers.length<target){let x=pool.pop();if(x&&!S.offers.includes(x))S.offers.push(x)}S.stars=S.rep>85?5:S.rep>60?4:S.rep>38?3:S.rep>20?2:0}
function recruit(){offers();return '<div class="grid"><div class="card s4"><div class="k">RECRUIT PROFILE</div><div class="big">'+(S.stars?"★".repeat(S.stars):"Unrated")+'</div><p>Reputation '+S.rep+'</p></div><div class="card s8"><h3>College Interest / Offers</h3>'+(S.offers.length?S.offers.map(x=>'<div class="feed"><b>'+x+'</b> <span class="muted">· Scholarship interest</span></div>').join(""):'<p class="muted">No college offers yet. Play well and earn varsity snaps.</p>')+'</div></div>'}
function transfer(){if(S.phase!=="HS")return '<div class="card"><h2>Transfer options</h2><p class="muted">College transfer portal unlocks in the college phase.</p></div>';let done=S.schedule.every(x=>x.played);return '<div class="card"><div class="k">HIGH SCHOOL TRANSFER</div><h2>'+(done?"Offseason Decision":"Transfer Schools")+'</h2><p class="muted">You can stay or move to another program. A transfer resets some coach trust, but the new school may be stronger or fit you better.</p><div class="actions"><button class="primary" id="stay">'+(done?"Stay & Advance Year":"Stay at "+S.team)+'</button><button class="alt" id="showTransfer">Choose New High School</button></div><div id="transferList"></div></div>'}
function doTransfer(n){let old=S.team;S.team=n;S.transfers++;S.coach=clamp(S.coach-rnd(8,18),15,100);S.morale=clamp(S.morale+rnd(-5,8),35,100);S.news.push("Transferred from "+old+" to "+n+".");if(S.schedule.every(x=>x.played))advanceYear();else makeSchedule();save();page="Career";render()}
function advanceYear(){S.history.push({year:S.year,text:grade()+" at "+S.team+": "+S.record[0]+"-"+S.record[1]+", "+S.season.g+" games"});if(S.grade<12){S.grade++;S.age++;S.year++;S.record=[0,0];S.season={g:0,yds:0,td:0,tkl:0,sck:0,int:0};S.energy=100;S.coach=clamp(S.coach+rnd(-4,6),15,100);makeSchedule();S.news.push("You begin "+grade()+" year at "+S.team+".")}else{S.phase="College";S.year++;S.age++;S.team=S.offers.length?S.offers[0]:"South Florida";S.news.push("High school career complete. You join "+S.team+".");S.schedule=[]}save()}
function offseason(){return '<div class="card"><div class="k">SEASON COMPLETE</div><h2>'+S.record[0]+'-'+S.record[1]+'</h2><p>Decide whether to stay at '+S.team+' or transfer before next season.</p><button class="primary" data-go="Transfer">Offseason Decisions</button></div>'}
function history(){return '<div class="card"><h2>Career Timeline</h2>'+(S.history.length?S.history.slice().reverse().map(x=>'<div class="feed"><b>'+x.year+'</b> · '+x.text+'</div>').join(""):'<p class="muted">Your freshman story is just beginning.</p>')+'<br><button class="danger" id="reset">Start New Career</button></div>'}
function bind(){document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{page=b.dataset.go;render()});document.querySelectorAll("[data-prep]").forEach(b=>b.onclick=()=>prep(b.dataset.prep));document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>choose(b.dataset.choice));let st=document.getElementById("stay");if(st)st.onclick=()=>{if(S.schedule.every(x=>x.played))advanceYear();page="Career";render()};let sh=document.getElementById("showTransfer");if(sh)sh.onclick=()=>{document.getElementById("transferList").innerHTML='<div class="schools">'+HS.filter(x=>x[0]!==S.team).map(x=>'<button class="alt" data-move="'+x[0]+'"><b>'+x[0]+'</b><br><span class="mini">'+x[2]+' · Program '+x[1]+'</span></button>').join("")+'</div>';document.querySelectorAll("[data-move]").forEach(b=>b.onclick=()=>doTransfer(b.dataset.move))};let r=document.getElementById("reset");if(r)r.onclick=()=>{if(confirm("Start over?")){try{localStorage.removeItem("gl5")}catch(e){}S=null;creator()}}}
window.addEventListener("error",e=>{document.getElementById("app").innerHTML='<main><div class="card"><h1>Game Error</h1><p>'+e.message+'</p></div></main>'});load();render();
</script></body></html>
